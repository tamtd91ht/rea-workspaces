# Metadata dự án (schema_version 2). Xem docs/project-lifecycle.md.
# Giữ các khóa scalar cấp cao nhất trên một dòng: scripts/check.mjs đọc chúng.
# Không bao giờ ghi thông tin đăng nhập, token hay tên tài khoản cá nhân vào file này.
schema_version: 2
id: {{PROJECT_ID}}
title: "{{TITLE}}"
objective: "{{OBJECTIVE}}"
# investigation | ui-design | engineering | combined
type: {{PROJECT_TYPE}}
modules: [{{MODULES}}]
# proposed | initialized | investigating | design | implementation | review | completed | archived
status: initialized
created: {{CREATED}}
updated: {{CREATED}}
# Vai trò hoặc nhóm, không phải tên đăng nhập.
owner: ""
target:
  # javascript-electron | native-binary | dotnet | android-apk | website |
  # network-capture | firmware | other | none (không có giai đoạn điều tra)
  type: {{TARGET_TYPE}}
  # Đường dẫn cục bộ hoặc URL, không chứa thông tin đăng nhập hay token. Chi tiết: scope/target.md
  location: ""
authorization:
  # owned | employer-owned | written-permission | open-source-license | ctf | other
  basis: ""
  confirmed: false
  record: scope/authorization.md
design:
  ui: {{HAS_DESIGN}}
  # Design system hiện có cần tôn trọng (đường dẫn/tên), hoặc "" nếu không có.
  existing_system: ""
  accepted: design/design-system.md
implementation:
  # Repository/đường dẫn của bạn nơi viết code (không bao giờ là rea-core hay repo tham chiếu).
  repository: ""
  stack: ""
tools:
  rea: "{{REA_VERSION}}"
  ui_ux_pro_max: "{{UIUX_VERSION}}"
  ecc_commit: "76aaa77"
  providers: []
git: {{GIT}}
tags: []
